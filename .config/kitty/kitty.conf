kitty_mod ctrl+shift

# BEGIN_KITTY_THEME
include current-theme.conf
# END_KITTY_THEME

# FONTS
font_family Comic Neue, IBM Plex Mono, JetBrainsMono Nerd Font, Material Symbols Rounded 
bold_font auto
italic_font auto
bold_italic_font auto
font_size 10

# CURSOR SETTINGS
cursor_trail 10
cursor_trail_start_threshold 0
cursor_trail_decy 0.01 0.05
cursor_shape block
cursor_blink true

# TRANSPARENCY AND BLUR
set_background_opacity 1
background_opacity 0.9
background_blur 32

# LAYOUTS
enabled_layouts tall

# MARGINS
window_margin_width 7
window_border_width 2pt

# TABS
tab_bar_style powerline

# SOUNDS 
enable_audio_bell no 
