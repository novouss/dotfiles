# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

# Makes pavucontrol to floating
windowrule = float, class:org.pulseaudio.pavucontrol

# Makes Firefox Profile  window to floating
windowrule = float, initialTitle:Firefox - Choose User Profile

# Steam interrupts fullscreen games on reset
# This forces hyprland to workspace 1
windowrule = workspace 1 silent, title:^(Steam)$
windowrule = workspace 1 silent, title:^(steam)$
windowrule = workspace 1 silent, title:^(steamwebhelper)$
